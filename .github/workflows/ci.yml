name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend + API (lint, typecheck, unit tests, build, Playwright E2E)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: portalrpg
          POSTGRES_USER: portalrpg
          POSTGRES_PASSWORD: portalrpg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portalrpg -d portalrpg"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://portalrpg:portalrpg@localhost:5432/portalrpg
      JWT_SECRET: ci-only-insecure-secret-0123456789-abcdef-0123456789-abcdef
      AI_PROVIDER: echo
      EMBEDDINGS_PROVIDER: hashing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Create pgvector/pgcrypto extensions
        run: |
          PGPASSWORD=portalrpg psql -h localhost -U portalrpg -d portalrpg \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pgcrypto;"
      - name: Apply schema (drizzle-kit migrate + ivfflat index)
        working-directory: frontend
        run: |
          npx drizzle-kit migrate
          PGPASSWORD=portalrpg psql -h localhost -U portalrpg -d portalrpg -f drizzle/manual/ivfflat_index.sql
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Seed dev accounts (used by Playwright specs)
        working-directory: frontend
        run: npx tsx scripts/dev-seed.ts
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright)
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
